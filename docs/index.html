<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script>
    (function () {
      var base = '/';
      if (location.hostname.endsWith('github.io')) {
        var match = location.pathname.match(/^(\/[^/]+\/)/);
        if (match) base = match[1];
      }
      document.write('<base href="' + base + '">');
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Testing Dashboard</title>
  <meta name="description" content="Professional testing dashboard for site, phone, domain, and spreadsheet automation." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app-shell" class="app-shell" aria-busy="true">
    <div class="boot-loader" role="status">Loading dashboard…</div>
  </div>
</body>
</html>
